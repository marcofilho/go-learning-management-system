version: '3.8'

# Production configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  postgres:
    # Production postgres settings
    environment:
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    # Don't expose postgres port externally in production
    ports: []
    # Production-grade health check
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # Backup configuration (optional)
    # volumes:
    #   - ./backups:/backups

  api:
    # Production build optimizations
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.24
    # Production environment
    environment:
      GIN_MODE: release
      LOG_LEVEL: info
    # Don't restart on failure in production without investigation
    restart: on-failure:3
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      replicas: 1
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
