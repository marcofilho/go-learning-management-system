version: '3.8'

# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    # Expose postgres directly for local development tools
    ports:
      - "5432:5432"
    # Add pgAdmin for database management (optional)
    # Uncomment if needed:
    # command: postgres -c log_statement=all

  api:
    # Enable hot reload with volume mount
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent mounting of vendor and bin
      - /app/bin
      - /app/vendor
    environment:
      # Development settings
      GIN_MODE: debug
      LOG_LEVEL: debug
    # Override command for hot reload (requires air)
    # command: air -c .air.toml

